name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  static-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify static assets present and non-empty
        run: |
          test -s README.md
          test -s index.html
          test -d craft
          echo "static-smoke ok: README.md, index.html, craft/ present"
